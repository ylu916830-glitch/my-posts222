name: Generate GitHub Article URLs

on:
  push:
    paths:
      - "*.md"
      - ".github/workflows/generate-urls.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Generate urls.txt
        shell: bash
        run: |
          python - <<'PY2'
          from pathlib import Path
          from urllib.parse import quote
          files = sorted(p for p in Path(".").glob("*.md") if p.name != "README.md")
          base = "https://github.com/ylu916830-glitch/my-posts222/blob/main/"
          urls = [base + quote(p.name, safe="") for p in files]
          Path("urls.txt").write_text("\n".join(urls) + ("\n" if urls else ""), encoding="utf-8")
          print(f"Generated {len(urls)} URLs")
          PY2
      - name: Commit urls.txt
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add urls.txt
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "Generate article URL list"
            git push
          fi
